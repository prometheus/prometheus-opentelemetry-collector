display_name: Postgres Receiver
type: postgres_exporter
github_project: prometheus/prometheus-opentelemetry-collector

description: |
  Receives PostgreSQL metrics by running the Prometheus
  [postgres_exporter](https://github.com/prometheus-community/postgres_exporter)
  as an OpenTelemetry Collector receiver.

status:
  disable_codecov_badge: true
  class: receiver
  stability:
    development: [metrics]
  distributions: [prometheus]
  codeowners:
    active: [ArthurSens]

feature_gates:
  - id: receiver.postgresExporter.OTelSemanticConventions
    description: Enables OpenTelemetry semantic convention transformations for postgres_exporter metrics.
    stage: alpha
    from_version: v0.1.0
    reference_url: https://github.com/prometheus/prometheus-opentelemetry-collector/pull/21

tests:
  skip_lifecycle: true
  skip_shutdown: true
