display_name: MySQLd Receiver
type: mysqld_exporter
github_project: prometheus/prometheus-opentelemetry-collector

description: |
  Receives MySQL server metrics by running the Prometheus
  [mysqld_exporter](https://github.com/prometheus/mysqld_exporter)
  as an OpenTelemetry Collector receiver.

status:
  disable_codecov_badge: true
  class: receiver
  stability:
    development: [metrics]
  distributions: [prometheus]
  codeowners:
    active: [ArthurSens]

tests:
  skip_lifecycle: true
  skip_shutdown: true
